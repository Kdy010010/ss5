<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StarShield 5 : 인류의 등불 — Epilogue</title>

<style>
:root{
  --text:#f4f8ff;
  --accent:#5fd0ff;
  --danger:#ff4b81;
  --gold:#ffd166;
  --panelA: rgba(8,12,42,.92);
  --panelB: rgba(4,7,26,.92);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
html,body{height:100%}
body{
  background: radial-gradient(circle at 18% 12%, #142058 0%, #05011b 45%, #02000c 100%);
  color:var(--text);
  overflow:hidden;
}

#stars{position:fixed;inset:0;z-index:0}
.vignette{position:fixed;inset:-20%;z-index:1;pointer-events:none;
  background:radial-gradient(circle at 50% 30%, transparent 35%, rgba(0,0,0,.9) 100%);
}
.scan{position:fixed;inset:0;z-index:2;opacity:.08;pointer-events:none;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.15) 0 1px, transparent 1px 3px);
}

.wrap{position:relative;z-index:3;height:100%;display:flex;align-items:center;justify-content:center;padding:18px}
.card{
  width:min(980px,100%);
  background:linear-gradient(180deg,var(--panelA),var(--panelB));
  border-radius:22px;
  box-shadow:0 18px 60px rgba(0,0,0,.6);
  border:1px solid rgba(95,208,255,.25);
  overflow:hidden;
  animation:cardIn .9s ease forwards;
}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.topbar{
  padding:14px 18px;
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(10,14,40,.6);
}
.badge{font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:8px;box-shadow:0 0 8px var(--accent)}

.content{padding:18px;display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
@media(max-width:860px){.content{grid-template-columns:1fr}}

.title{font-size:30px;line-height:1.2}
.subtitle{margin-top:6px;color:#9fb4ff;font-size:14px;text-transform:uppercase;letter-spacing:.06em}

.panel{
  margin-top:14px;
  border-radius:18px;
  background:rgba(5,0,20,.3);
  border:1px solid rgba(80,110,255,.25);
  padding:14px;
}
.panel h3{font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:10px;color:#9fb4ff}

.typebox{
  font-size:15px;
  line-height:1.75;
  white-space:pre-wrap;
  min-height:300px;
}
.cursor{color:var(--accent);animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:0}}

.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.chip{
  font-size:12px;padding:8px 10px;border-radius:999px;
  background:rgba(166,176,255,.1);
}
.chip b{color:var(--gold)}

.visual{
  border-radius:18px;
  min-height:340px;
  background:
    linear-gradient(to top, rgba(0,0,0,.85), rgba(0,0,0,.15) 60%),
    radial-gradient(circle at 50% 40%, rgba(95,208,255,.15), transparent 60%),
    url("epilogue.png") center/cover no-repeat;
  border:1px solid rgba(95,208,255,.2);
  position:relative;
}
.caption{
  position:absolute;left:14px;right:14px;bottom:12px;
  font-size:13px;line-height:1.5;
}

.actions{
  padding:14px 18px;
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(10,14,40,.4);
}
.hint{font-size:13px;color:#9fb4ff}
.btn{
  padding:10px 14px;border-radius:14px;
  background:linear-gradient(180deg,var(--accent),#1f86d6);
  color:#02020c;text-decoration:none;font-weight:800;
}

.fadeout{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:.6s;z-index:50}
.fadeout.on{opacity:1;pointer-events:auto}
</style>
</head>

<body>
<canvas id="stars"></canvas>
<div class="vignette"></div>
<div class="scan"></div>
<div class="fadeout" id="fade"></div>

<div class="wrap">
  <div class="card">
    <div class="topbar">
      <div class="badge"><span class="dot"></span>EPILOGUE · FINAL TRANSMISSION</div>
      <div>OPERATION LIGHTHOUSE · «BLACK LIGHTHOUSE»</div>
    </div>

    <div class="content">
      <div>
        <div class="title">이옴의 <span style="color:var(--danger)">마지막 송신</span>이 <span style="color:var(--accent)">꺼졌다</span></div>
        <div class="subtitle">Last Transmission · Operation Lighthouse</div>

        <div class="panel">
          <h3>Intercepted Signal · 1420.405 MHz</h3>
          <div class="typebox" id="type"></div><span class="cursor">▍</span>
          <div class="meta">
            <div class="chip"><b>상태</b> 기함 격침</div>
            <div class="chip"><b>함대</b> 통제 상실</div>
            <div class="chip"><b>작전</b> 종료</div>
          </div>
        </div>
      </div>

      <div class="visual">
        <div class="caption">
          <b>Black Lighthouse Core</b><br>
          그들은 우리의 빛을 빼앗으러 왔다.<br>
          그러나 그 불은 꺼지지 않았다.
        </div>
      </div>
    </div>

    <div class="actions">
      <div class="hint">ENTER를 누르면 전장으로 돌아갑니다</div>
      <a class="btn" href="ss5.html" onclick="return navWithFade(event,this.href)">전장으로 ▶</a>
    </div>
  </div>
</div>

<script>
/* starfield */
const c=document.getElementById('stars'),ctx=c.getContext('2d');
let W,H,DPR=1,stars=[];
function resize(){
  DPR=Math.max(1,devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  c.width=W*DPR;c.height=H*DPR;
  c.style.width=W+'px';c.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  stars=[...Array(300)].map(()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,v:Math.random()*.2+.05}));
}
addEventListener('resize',resize);resize();
(function loop(){
  ctx.clearRect(0,0,W,H);
  for(const s of stars){
    s.y+=s.v;if(s.y>H)s.y=0;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle="#fff";ctx.fill();
  }
  requestAnimationFrame(loop);
})();

/* typewriter */
const lines=[
"[가로챈 기록] 이옴 기함 «검은 등대» — 최종 송신",
"",
"우리는 죽어가는 행성에서 왔다.",
"1977년, 우리는 너희에게 경고했다. — 파멸을 준비하라고.",
"",
"그것은 위협이 아니라, 질투였다.",
"너희에겐 아직 빛이 있었고, 우리에겐 없었다.",
"",
"그래서 우리는 너희의 빛을 빼앗으러 왔다.",
"카이퍼 벨트에서, 화성에서, 달의 잿더미 위에서,",
"그리고 너희의 마지막 하늘에서 —",
"우리는 그 등불을 끄려 했다.",
"",
"그러나 그 불은 꺼지지 않았다.",
"밀어내도, 밀어내도, 다시 타올랐다.",
"",
"기함의 핵이 멈춘다.",
"검은 등대가 어둠에 잠긴다.",
"",
"마지막으로 묻는다, 인류여 —",
"너희의 빛은 대체 어디서 오는가?",
"",
"…답은 송신되지 않았다.",
"대신, 하나의 신호가 지구로 다시 퍼졌다.",
"",
"“우리의 기회는 아직 끝나지 않았다.”",
"비록 너희 미국은 이기지 못했지만",
 "우리는 반드시 인류를 무너뜨릴 것이다",
  "다음은 소련이다.",
  "그들에게 단단히 일러두어라",
""
];

const el=document.getElementById('type');
const text=lines.join("\n");
let i=0;
(function type(){
  el.textContent=text.slice(0,i++);
  if(i<text.length)setTimeout(type,text[i]==="\n"?18:22);
})();

/* fade */
const fade=document.getElementById('fade');
function navWithFade(e,href){
  e.preventDefault();fade.classList.add('on');
  setTimeout(()=>location.href=href,650);
  return false;
}
addEventListener('keydown',e=>{if(e.key==="Enter")navWithFade(e,"ss5.html")});
</script>
</body>
</html>
